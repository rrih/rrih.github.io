name: Verify and deploy independent sites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run dev-check
      - uses: actions/upload-artifact@v4
        with:
          name: profile
          path: dist/
          include-hidden-files: true
  atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run dev-check
      - uses: actions/upload-artifact@v4
        with:
          name: atlas
          path: atlas/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility
          path: atlas/hosting/
  pictulane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pictulane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tools/pictulane/package-lock.json
      - run: npm ci
      - run: npm run dev-check
      - run: npx playwright install --with-deps chromium
      - run: npm run build:test && npm run e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pictulane
          path: tools/pictulane/dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pictulane-tests
          path: tools/pictulane/test-results/
  assemble:
    needs: [profile, atlas, pictulane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: bun deployment/compose.ts artifacts/profile artifacts/atlas artifacts/compatibility site-dist artifacts/pictulane
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
