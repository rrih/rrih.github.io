name: Check published personal site and Atlas
on:
  schedule:
    - cron: '21 1 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Verify and deploy independent sites]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Verify public pages after CDN publication
        run: |
          for attempt in 1 2 3; do
            sh scripts/rust.sh run --locked -p xtask -- verify-production && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-check
          path: work/production-check/latest.json
          if-no-files-found: ignore
