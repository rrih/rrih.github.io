[package]
name = "atlas-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
renderer-qa = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
yew.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlDialogElement", "HtmlAnchorElement", "HtmlCanvasElement", "EventTarget", "KeyboardEvent", "MouseEvent", "InputEvent", "FocusEvent", "Location", "History", "Navigator", "Storage", "Request", "RequestInit", "Response", "Headers", "AbortController", "AbortSignal", "Url", "UrlSearchParams", "Node", "NodeList", "Blob", "File", "FileList", "BlobPropertyBag", "MediaQueryList", "ServiceWorkerContainer", "ServiceWorkerRegistration", "ServiceWorker", "console"] }
futures-util = "0.3"
gloo-events = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
