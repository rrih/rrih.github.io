<!doctype html>
<html lang="{{locale}}" dir="{{direction}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f1">
<title>rrih — Web Developer</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
{{alternates}}
<link rel="icon" href="https://github.com/rrih.png">
<link rel="stylesheet" href="/style.css">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="rrih">
<meta property="og:title" content="rrih — Web Developer">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:image" content="https://rrih.github.io/profile-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="rrih — Web Developer. TypeScript, Go, Cloudflare.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@rrih_dev">
{{structured}}
<script src="/profile.js" defer></script>
</head>
<body>
<div class="page">
<header><img class="avatar" src="https://github.com/rrih.png" alt="rrih" width="40" height="40" fetchpriority="high"><details class="languages"><summary>{{language}} <span aria-hidden="true">↗</span></summary><nav aria-label="{{language}}">{{languages}}</nav></details></header>
<main>
<div class="identity"><div><p class="role" lang="en">Web Developer</p><h1>rrih</h1></div></div>
<p class="bio">{{bio}}</p>
<p class="stack">{{stack}}</p>
</main>
<footer><span class="copyright">© rrih</span><nav aria-label="Social"><a href="https://x.com/rrih_dev">X <span aria-hidden="true">↗</span></a><a href="https://github.com/rrih">GitHub <span aria-hidden="true">↗</span></a></nav></footer>
</div>
</body>
</html>
