[package]
name = "pictulane"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "HtmlImageElement", "HtmlInputElement", "HtmlSelectElement", "History", "Location", "Navigator", "Storage", "ServiceWorker", "ServiceWorkerContainer", "ServiceWorkerRegistration", "ServiceWorkerState", "RegistrationOptions", "ServiceWorkerUpdateViaCache", "MessageChannel", "MessagePort", "MessageEvent", "Clipboard", "VisualViewport", "Performance", "PointerEvent", "KeyboardEvent", "FocusOptions", "VisibilityState"] }
gloo-events = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
